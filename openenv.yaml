spec_version: 1
name: arjuna-perception-env
type: space
runtime: fastapi
app: server.app:app
port: 7860
description: >-
  A 3-step sequential robot perception environment. Each episode progresses through object
  identification (easy), multi-object triage (medium), and low-confidence decision making (hard).
  The agent receives YOLO-style scene descriptions and must make correct perception decisions.
  Rewards range 0.0–1.0 with partial credit and semantic grading.
version: "1.0.0"
author: Calpol500mg
documentation_url: "https://huggingface.co/spaces/Calpol500mg/arjuna-env"

episode_steps: 3
episode_description: >
  3-step sequential episode: identify → triage → decide.
  Scenes are dynamically generated by LLM with hardcoded fallback.
  Difficulty auto-adjusts based on agent performance history.

features:
  dynamic_scenes: false  # optional, requires API_BASE_URL + HF_TOKEN
  auto_curriculum: true
  difficulty_levels:
    - easy
    - medium
    - hard
  scene_generation: llm_with_fallback
  curriculum_window: 5
  promote_threshold: 0.85
  demote_threshold: 0.60

tasks:
  - id: single_object_identification
    description: "Identify the primary object from a YOLO detection"
    difficulty: easy
    steps_per_episode: 1
    reward_range: [0.0, 1.0]
  - id: multi_object_triage
    description: "Rank multiple detected objects by priority"
    difficulty: medium
    steps_per_episode: 1
    reward_range: [0.0, 1.0]
  - id: low_confidence_decision
    description: "Decide action for a low-confidence detection"
    difficulty: hard
    steps_per_episode: 1
    reward_range: [0.0, 1.0]
